version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: smart-blood-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: blood_donation_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blood-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-blood-backend
    restart: always
    depends_on:
      mysqldb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/blood_donation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    networks:
      - blood-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-blood-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - blood-network

networks:
  blood-network:
    driver: bridge

volumes:
  db_data:
